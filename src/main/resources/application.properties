spring.application.name=kembang-backend

# Lee el .env de la raiz del proyecto como si fuera un .properties
spring.config.import=optional:file:.env[.properties]

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
# El plan gratis de Neon limita las conexiones simultaneas
spring.datasource.hikari.maximum-pool-size=5

# Crea/actualiza las tablas a partir de las clases @Entity
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

# ${X:valor} = usa X del .env; si no existe, usa valor
server.port=${PORT:8080}
app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:5173,http://localhost:3000}